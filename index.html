<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti ❤️</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS principal -->
    <link rel="stylesheet" href="css/styleSobre.css">

    <!-- CSS responsive -->
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

    <main class="pagina-inicio">

        <!-- Decoración superior -->
        <div class="ornamento">
            ❦
        </div>


        <!-- Texto de bienvenida -->
        <section class="bienvenida">

            <p class="texto-pequeno">
                Mi Charis
            </p>

            <h1>
                Tengo una pequeña
                <span>sorpresa</span>
                para ti
            </h1>

            <div class="separador">
                ❧ ♡ ❧
            </div>

        </section>


        <!-- Sobre -->
        <button id="btnAbrir" class="sobre" type="button" aria-label="Abrir mi regalo">

            <div class="carta">
                <span>Hecho con amor</span>
                <span>Para ti...</span>
                <div>♡</div>
            </div>


            <!-- Solapa del sobre -->
            <div class="solapa"></div>

            <!-- Parte interior -->
            <div class="interior-sobre"></div>

            <!-- Sello -->
            <span class="sello">
              
                    <i class="fa-solid fa-rose"></i>
                
            </span>

        </button>

        </section>

        <p class="mensaje-sobre">
            Toca el sobre para descubrirlo
        </p>


        <!-- JavaScript -->
        <script src="javascript/script.js"></script>

</body>

</html>
